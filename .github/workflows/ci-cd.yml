name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Tests et validation
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier les dépendances
        run: python -m scripts.check_setup

      - name: Vérifier l'environnement Gymnasium
        run: python -m scripts.validate_env

      - name: Exécuter les tests
        run: python -m pytest -q

      - name: Vérifier l'encodeur visuel
        run: python -m scripts.test_encoder

  cd:
    name: Livrer l'artefact
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer l'archive du projet
        run: git archive --format=zip --output=world_model_agent_training.zip HEAD

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: world-model-agent-training
          path: world_model_agent_training.zip

